# ============================================================
# 羽毛球后端反向代理（端口 3001）
#
# 访问路径：https://esccry.top/api/badminton/...
#
# 用法：整段粘贴到 nginx.conf 中监听 443 的 server { } 内部，
#       与已有 location / 、 location /api/werewolf/ 并列，不需要新建 server 块。
#
# 前提：后端 .env 里
#         PORT=3001
#         HOST=127.0.0.1
#         PUBLIC_BASE_URL=https://esccry.top/api/badminton
#
# 改完执行：
#         cd C:\nginx
#         .\nginx.exe -t
#         .\nginx.exe -s reload
# ============================================================

# 不带尾斜杠时跳到带斜杠，避免浏览器里访问 /api/badminton 落到静态根目录
location = /api/badminton {
    return 301 /api/badminton/;
}

location /api/badminton/ {
    # 末尾这个斜杠不能少。
    # 有斜杠：/api/badminton/matches/list → 后端收到的 /matches/list（正确）
    # 无斜杠：/api/badminton/matches/list → 后端收到的 /api/badminton/matches/list（全部 404）
    proxy_pass http://127.0.0.1:3001/;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 头像上传单文件上限 10MB。nginx 默认 1MB，超过直接返回 413，
    # 小程序端只会看到「上传失败」，日志里才有 413，很容易误判成后端问题。
    client_max_body_size 10m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}
